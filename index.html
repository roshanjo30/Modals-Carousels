<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/form.css">
        <title>BMW</title>
    </head>
    <body>

        <div id="topbar">
            <img src="assets/images/bmw_logo.png" width="100" height="100">
            <p class="topcontent">Sedan</p>
            <p class="topcontent">SUV</p>
            <button id="book">BOOK A TEST DRIVE</button>
        </div>

        <div id="modal" > 
            <div class="modal-content">
                <img src="assets/images/bmw_ann.png" width="50" height="50">
                <button id="close-modal">X</button>
            </div>
        </div>
        
        <div class="carousel">
            <button id="previous"><-</button>

            <div class="slides">
                <div class="slide">
                    <img src="assets/images/bmw1.jpg" alt="bmw1" width="100" height="200">
                </div>
                <div class="slide">
                    <img src="assets/images/bmw2.jpg" alt="bmw2" width="100" height="200">
                </div>
                <div class="slide">
                    <img src="assets/images/bmw3.jpg" alt="bmw3" width="100" height="200">
                </div>
            </div>

            <button id="next">-></button>
            <div class="dots">
                <button class="dot">O</button>
                <button class="dot">O</button>
                <button class="dot">O</button>
            </div>
        </div>


        <div class="form" hidden>

            <div class="form-content">
                <div class="form-step">
                    <h3>Step 1: Name & Email</h3>

                    <label for="name">Name</label>
                    <input type="text" id="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" required>

                    <button type="button" class="next">Next</button>

                    <p id="email-error"></p>
                </div>
                
            

                <div class="form-step" hidden>
                    <h3>Step 2: Address</h3>
    
                    <label for="city">City</label>
                    <input type="text" id="city" required>
    
                    <label for="zip">ZipCode</label>
                    <input type="text" id="zip" required>
    
                    <button type="button" class="next">Next</button>
                    <p id="field-error"></p>

                </div>
                <div class="form-step" hidden>
    
                    <p>Test Drive Confirmed</p>
    
                    <button type="button" class="done">Done</button>

                </div>
            </div>
    
        </div>
       
       

        <script src="assets/js/modal.js"></script>
        <script src="assets/js/carousel.js"></script>
        <script src="assets/js/form.js"></script>
    </body>
</html>
