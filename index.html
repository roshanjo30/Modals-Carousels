<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/form.css">
        <link rel="stylesheet" href="assets/css/models.css">
        <link rel="stylesheet" href="assets/css/scroll.css">
        <title>BMW</title>
    </head>
    <body>

        <header>
            <nav id="topbar">
                <img src="assets/images/bmw_logo.png" alt="BMW logo" width="100" height="100">
                <p class="topcontent">Sedan</p>
                <p class="topcontent">SUV</p>
                <button id="book">BOOK A TEST DRIVE</button>
            </nav>

            <div id="modal" > 
                <div class="modal-content">
                    <img src="assets/images/bmw_ann.png" alt="BMW anniversary logo" width="50" height="50">
                    <button id="close-modal" aria-label="close-modal">X</button>
                </div>
            </div>
        </header>

        <div class="carousel">
            <button id="previous" aria-label="Previous Slide"><-</button>

            <div class="slides">
                <div class="slide">
                    <img src="assets/images/bmw1.jpg" alt="bmw coupe" width="100" height="200">
                </div>
                <div class="slide">
                    <img src="assets/images/bmw2.jpg" alt="bmw coupe" width="100" height="200">
                </div>
                <div class="slide">
                    <img src="assets/images/bmw3.jpg" alt="bmw coupe" width="100" height="200">
                </div>
            </div>
            <button id="next" aria-label="Next Slide">-></button>

            <div class="dots">
                <button class="dot" aria-label="Go to slide 1" aria-current="true">O</button>
                <button class="dot" aria-label="Go to slide 2">O</button>
                <button class="dot" aria-label="Go to slide 3">O</button>
            </div>
        </div>


        <div class="form" hidden>

            <div class="form-content">
                <div class="form-step">
                    <h3>Step 1: Name & Email</h3>

                    <label for="name">Name</label>
                    <input type="text" id="name" required>

                    <label for="email">Email</label>
                    <input type="email" 
                           id="email" 
                           aria-describedby="email-error"
                           required>

                    <button type="button" class="next">Next</button>

                    <p id="email-error" role="alert"></p>
                </div>
                
            

                <div class="form-step" hidden>
                    <h3>Step 2: Address</h3>
    
                    <label for="city">City</label>
                    <input type="text" id="city" aria-describedby="field-error"required>
    
                    <label for="zip">ZipCode</label>
                    <input type="text" id="zip" aria-describedby="field-error" required>
    
                    <button type="button" class="next">Next</button>
                    <p id="field-error" role="alert"></p>

                </div>
                <div class="form-step" hidden>
    
                    <p>Test Drive Confirmed</p>
    
                    <button type="button" class="done">Done</button>

                </div>
            </div>
    
        </div>

        <div class="models">
                <div class="info">
                    <h2>BMW Models</h2>

                    <div id="find">
                        <input type="text" id="search" placeholder="Search for models">
                    </div>

                    <p id="models"></p>

                    <div class="pagination">
                        <button id="prev">Previous</button>
                        <span id="page-no">1</span>
                        <button id="nex">Next</button>
                    </div>
                </div>

                <div class="sorting">
                    <select id="sort">
                        <option value="default">Default</option>
                        <option value="asc">A → Z</option>
                        <option value="desc">Z → A</option>
                    </select>
                </div>
        </div>

        <div class="scroll">
            <h2>Gallery</h2>
            <div id="posts"></div>

            <p id="loading" hidden>Loading...</p>
        </div>
       
       

        <script src="assets/js/modal.js"></script>
        <script src="assets/js/carousel.js"></script>
        <script src="assets/js/form.js"></script>
        <script src="assets/js/models.js"></script>
        <script src="assets/js/posts.js"></script>
    </body>
</html>
